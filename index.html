function deco(x,L,z){const d=L.d;x.save();x.scale(z,z);x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.ellipse(5,24,30,10,0,0,7);x.fill();x.lineWidth=2.5;x.strokeStyle='rgba(0,0,0,.65)';let q;

x.restore()}
function buildBg(l){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),L=LV[l],d=L.d,TS=48,b=[1,3,5].map(i=>parseInt(L.c1.substr(i,2),16)*1.8);let s=l*977+31;const R=()=>(s=s*16807%2147483647)/2147483647;
for(let ty=0;ty<12;ty++)for(let tx=0;tx<20;tx++){const v=(R()-.5)*18,pa=(d=='tree'||d=='tomb')&&ty>=5&&ty<=6,X=tx*TS,Y=ty*TS;
x.fillStyle=`rgb(${b.map(q=>Math.max(0,Math.min(255,(q+v)*(pa?1.25:1)))|0)})`;x.fillRect(X,Y,TS,TS);
x.fillStyle='rgba(255,255,255,.07)';x.fillRect(X,Y,TS,2);x.fillRect(X,Y,2,TS);x.fillStyle='rgba(0,0,0,.14)';x.fillRect(X,Y+TS-2,TS,2);x.fillRect(X+TS-2,Y,2,TS);
if(d=='tree'||d=='tomb'){for(let i=0;i<2;i++){const px=X+R()*TS,py=Y+8+R()*(TS-12);x.strokeStyle='rgba(10,40,10,.45)';x.lineWidth=1.5;x.beginPath();x.moveTo(px,py);x.lineTo(px-2,py-6);x.moveTo(px,py);x.lineTo(px+2,py-7);x.stroke()}if(R()<.05){x.fillStyle=R()<.5?'#f4e04a':'#f08adf';x.beginPath();x.arc(X+R()*TS,Y+R()*TS,2.5,0,7);x.fill()}}
else if(d=='rock'){x.fillStyle='rgba(0,0,0,.18)';for(let i=0;i<3;i++){x.beginPath();x.ellipse(X+R()*TS,Y+R()*TS,3+R()*4,2+R()*2,0,0,7);x.fill()}}
else if(R()<.25){x.strokeStyle='rgba(0,0,0,.3)';x.lineWidth=1.5;const px=X+R()*TS,py=Y+R()*TS;x.beginPath();x.moveTo(px,py);x.lineTo(px+10,py+8);x.lineTo(px+6,py+18);x.stroke()}}
const pts=[];for(let i=20;i<W;i+=64)pts.push([i+R()*14,22+R()*8],[i+R()*14,H-24-R()*8]);for(let j=90;j<H-60;j+=70)pts.push([18+R()*8,j],[W-18-R()*8,j]);for(let i=0;i<7;i++)pts.push([180+R()*(W-360),100+R()*(H-200)]);

if(p.fy>-.6){g.fillStyle='#ff7a20';g.fillRect(2,-22,9,4)}

g.restore();
g.save();g.translate(p.x+d*11,p.y+4);if(fl)g.globalAlpha=.5;

g.rotate(p.at>0?a-1.3+(1-f)*2.6:(d>0?.9:Math.PI-.9));
q=g.createLinearGradient(0,-3,0,3);q.addColorStop(0,'#f2f6ff');q.addColorStop(1,'#6a7384');g.fillStyle=q;g.strokeStyle='rgba(0,0,0,.8)';g.lineWidth=2;g.fillRect(6,-3,48,6);g.strokeRect(6,-3,48,6);g.fillStyle='#c8941e';g.fillRect(2,-7,5,14);g.restore()}
function mon(e){const L=LV[S.lv],r=e.r,a=Math.atan2(p.y-e.y,p.x-e.x),ca=Math.cos(a),sa=Math.sin(a);g.save();g.translate(e.x,e.y+Math.sin(t*7+e.ph)*2);
g.fillStyle='rgba(0,0,0,.4)';g.beginPath();g.ellipse(0,r*.9,r*1.05,r*.4,0,0,7);g.fill();
if(L.k=='spe')g.globalAlpha=e.b?1:.78+.2*Math.sin(t*4+e.ph);

if(L.k=='spi'){g.strokeStyle=L.ec;g.lineWidth=3;for(let i=0;i<8;i++){const q=i/8*6.283+Math.sin(t*8+i)*.15;g.beginPath();g.moveTo(Math.cos(q)*r*.6,Math.sin(q)*r*.6);g.lineTo(Math.cos(q)*r*1.5,Math.sin(q)*r*1.5);g.stroke()}}

g.fillStyle=L.k=='spe'?'#fff':'#f33';[-1,1].forEach(s=>{g.beginPath();g.arc(ca*r*.5-sa*s*r*.3,sa*r*.5+ca*s*r*.3,r*.13+1,0,7);g.fill()});
if(e.b){g.fillStyle='#f0c040';g.beginPath();g.moveTo(-r*.7,-r*.8);g.lineTo(-r*.7,-r*1.5);g.lineTo(-r*.35,-r*1.1);g.lineTo(0,-r*1.6);g.lineTo(r*.35,-r*1.1);g.lineTo(r*.7,-r*1.5);g.lineTo(r*.7,-r*.8);g.fill()}

g.textAlign='left';g.font='bold 12px Georgia';g.fillStyle=p.en>=100?'#9cf':'#89a';g.fillText(p.en>=100?'⚡ Spécial prêt':'⚡ '+(p.en|0)+'%',194,y+8);g.fillStyle=p.ul>=100?'#d9a8ff':'#a88bc8';g.fillText(p.ul>=100?'💜 ULTIME prêt (X)':'💜 '+(p.ul|0)+'%',194,y+24);
g.font='15px Georgia';g.fillStyle='#e8dcc0';g.fillText('🪙 '+S.gold+'   🧪 '+S.pot,14,y+46);g.fillText('Niv. '+(S.lv+1)+' — '+LV[S.lv].n,14,y+66);
g.textAlign='center';const b=E.find(e=>e.b);if(b){bar(W/2-180,H-38,360,12,b.hp/b.mh,'#e0a040','#7a4a10');g.fillStyle='#e8dcc0';g.fillText(LV[S.lv].b,W/2,H-46)}
